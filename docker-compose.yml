# One command to run everything locally:  docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/aapna_times
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret_before_going_live}
      CLIENT_URL: http://localhost:5000
      PUBLIC_URL: http://localhost:5000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aapnatimes.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
    volumes: [uploads:/app/server/uploads]
volumes:
  mongo_data:
  uploads:
